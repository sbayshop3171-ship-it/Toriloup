name: Deploy Live

on:
  workflow_dispatch:
    inputs:
      deploy_live:
        description: Confirm deployment of the latest main commit after CI passes.
        required: true
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-live-main
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy To Toriloup Server
    if: ${{ inputs.deploy_live }}
    runs-on: ubuntu-latest

    env:
      REMOTE_RELEASE_ARCHIVE: /tmp/toriloup-release-${{ github.sha }}.tar.gz
      SSH_HOST: ${{ vars.SSH_HOST }}
      SSH_USER: ${{ vars.SSH_USER }}
      SSH_PORT: ${{ vars.SSH_PORT }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Confirm latest main passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Live deployment can only run from main."
            exit 1
          fi

          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "::error::main moved after this deployment was queued; run a new deployment for the latest commit."
            exit 1
          fi

          ci_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=100" \
            --jq ".workflow_runs | map(select(.head_sha == \"$GITHUB_SHA\")) | .[0].conclusion // \"missing\"")"
          if [ "$ci_conclusion" != "success" ]; then
            echo "::error::The selected main commit has no successful CI run (latest result: $ci_conclusion)."
            exit 1
          fi

      - name: Normalize deploy defaults
        run: |
          set -euo pipefail
          echo "SSH_PORT=${SSH_PORT:-22}" >> "$GITHUB_ENV"

      - name: Validate deploy secrets
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          missing=0

          for name in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing deploy configuration::$name is empty or not set."
              missing=1
            fi
          done

          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Prepare SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Prepare release archive
        run: |
          set -euo pipefail
          release_archive="$RUNNER_TEMP/toriloup-release-${GITHUB_SHA}.tar.gz"
          git archive --format=tar "$GITHUB_SHA" | gzip -n > "$release_archive"
          RELEASE_ARCHIVE_SHA256="$(sha256sum "$release_archive" | cut -d' ' -f1)"
          echo "RELEASE_ARCHIVE_SHA256=$RELEASE_ARCHIVE_SHA256" >> "$GITHUB_ENV"

      - name: Check Toriloup deploy helper
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/local/sbin/toriloup-manual-deploy --check"

      - name: Upload release archive
        run: |
          set -euo pipefail
          scp -P "$SSH_PORT" -i ~/.ssh/deploy_key \
            "$RUNNER_TEMP/toriloup-release-${GITHUB_SHA}.tar.gz" "$SSH_USER@$SSH_HOST:$REMOTE_RELEASE_ARCHIVE"

      - name: Re-check main and CI before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          latest_main="$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)"
          if [ "$latest_main" != "$GITHUB_SHA" ]; then
            echo "::error::main changed while the release was staged; refusing to publish a stale commit."
            exit 1
          fi

          ci_conclusion="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?branch=main&per_page=100" \
            --jq ".workflow_runs | map(select(.head_sha == \"$GITHUB_SHA\")) | .[0].conclusion // \"missing\"")"
          if [ "$ci_conclusion" != "success" ]; then
            echo "::error::CI is no longer successful for the staged commit (latest result: $ci_conclusion)."
            exit 1
          fi

      - name: Deploy with hardened server script
        run: |
          set -euo pipefail
          ssh -p "$SSH_PORT" -i ~/.ssh/deploy_key "$SSH_USER@$SSH_HOST" \
            "sudo -n /usr/local/sbin/toriloup-manual-deploy '$GITHUB_SHA' '$REMOTE_RELEASE_ARCHIVE' '$RELEASE_ARCHIVE_SHA256'"

      - name: Verify live endpoints
        run: |
          set -euo pipefail
          for url in \
            https://merchant.toriloup.com/login \
            https://merchant.toriloup.com/up \
            https://owner.toriloup.com/login \
            https://owner.toriloup.com/up; do
            curl --fail --silent --show-error --max-time 20 "$url" >/dev/null
            echo "HTTP check passed: $url"
          done
